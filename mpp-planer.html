// ---------------- Engine ----------------
const KEY = 'mpp-planer.v1';
let st = JSON.parse(localStorage.getItem(KEY) || '{"run":1,"cur":0,"answers":{},"archive":[]}');
function save(){ localStorage.setItem(KEY, JSON.stringify(st)); }
function ans(id){ return st.answers[id] || (st.answers[id] = {choice:null, note:'', done:false}); }
function secDone(s){ return s.items.every(it => (st.answers[it.id]||{}).done); }
function render(){
  const s = S[st.cur];
  let h = '<div class="card"><span class="teilbadge ' + (s.part==='A'?'tA':'tB') + '">' +
          (s.part==='A' ? 'TEIL A · KONZEPT (bis 31.08.)' : 'TEIL B · PRÜFUNGSWOCHE (12.–16.10.)') + '</span>' +
          '<h2>' + s.title + '</h2>' + (s.intro ? '<div class="intro">' + s.intro + '</div>' : '');
  for (const it of s.items) {
    const a = ans(it.id);
    h += '<div class="item"><div class="q">' + it.q + '</div>';
    if (it.info) h += '<div class="info">' + it.info + '</div>';
    for (const o of (it.options||[])) {
      h += '<label class="opt"><input type="radio" name="' + it.id + '" value="' + o.v + '"' +
           (a.choice===o.v?' checked':'') + ' onchange="pick(\'' + it.id + '\',\'' + o.v + '\')">' +
           '<b>' + o.label + '</b>' + (o.hint ? '<small>' + o.hint + '</small>' : '') + '</label>';
    }
    if (it.input) h += '<textarea placeholder="Deine Notiz / Begründung / Zahlen …" onchange="note(\'' + it.id + '\', this.value)">' + (a.note||'') + '</textarea>';
    h += '<div class="doneline"><label><input type="checkbox"' + (a.done?' checked':'') +
         ' onchange="doneIt(\'' + it.id + '\', this.checked)"> <b>Punkt entschieden / erledigt</b></label></div></div>';
  }
  h += '</div>';
  document.getElementById('page').innerHTML = h;
  document.getElementById('prev').disabled = st.cur===0;
  document.getElementById('next').disabled = st.cur===S.length-1;
  const total = S.reduce((n,x)=>n+x.items.length,0);
  const done = S.reduce((n,x)=>n+x.items.filter(it=>(st.answers[it.id]||{}).done).length,0);
  document.getElementById('stat').innerHTML = 'Durchlauf <b>' + st.run + '</b> · Abschnitt ' + (st.cur+1) + '/' + S.length + ' · <b>' + done + '/' + total + '</b> Punkte entschieden';
  const prog = document.getElementById('prog'); prog.innerHTML='';
  S.forEach((x,i)=>{ const p=document.createElement('div');
    p.className='pill ' + (x.part==='A'?'a':'b') + (secDone(x)?' done':'') + (i===st.cur?' cur':'');
    p.title=x.title; p.onclick=()=>{st.cur=i;save();render();window.scrollTo(0,0);}; prog.appendChild(p); });
}
function pick(id,v){ ans(id).choice=v; save(); }
function note(id,v){ ans(id).note=v; save(); }
function doneIt(id,v){ ans(id).done=v; save(); render(); }
function go(d){ st.cur=Math.max(0,Math.min(S.length-1,st.cur+d)); save(); render(); window.scrollTo(0,0); }
function jumpOpen(){ for(let i=0;i<S.length;i++){ if(!secDone(S[i])){ st.cur=i;save();render();window.scrollTo(0,0);return; } } alert('Alles entschieden! 🎉 Jetzt: Version speichern.'); }
function newRun(){ if(!confirm('Aktuellen Durchlauf archivieren und neu starten?'))return;
  st.archive.push({run:st.run, at:new Date().toISOString(), answers:st.answers});
  st.run++; st.answers={}; st.cur=0; save(); render(); }
function exportMd(){
  let md = '# MPP-Entscheidungen — Durchlauf ' + st.run + ' (' + new Date().toLocaleDateString('de-DE') + ')\n\n';
  md += '> Meisterprüfungsprojekt 2026 · Vorgabe HWK: EFH 100–110 m², 145–165 m² WF, DN 32–50° + Gaube, BbgBO\n\n';
  for (const s of S) {
    md += '## ' + (s.part==='A'?'🅰️ ':'🅱️ ') + s.title + '\n\n';
    for (const it of s.items) {
      const a = st.answers[it.id]||{};
      const o = (it.options||[]).find(x=>x.v===a.choice);
      md += '- ' + (a.done?'[x]':'[ ]') + ' **' + it.q + '**\n';
      md += '  - Entscheidung: ' + (o ? o.label : '_offen_') + '\n';
      if (a.note) md += '  - Notiz: ' + a.note.replace(/\n/g,' · ') + '\n';
    }
    md += '\n';
  }
  const blob = new Blob([md], {type:'text/markdown'});
  const aEl = document.createElement('a');
  aEl.href = URL.createObjectURL(blob);
  aEl.download = 'MPP-Entscheidungen_Durchlauf' + st.run + '_' + new Date().toISOString().slice(0,10) + '.md';
  aEl.click();
}
render();
</script>
