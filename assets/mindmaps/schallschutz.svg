<text x="28.0" y="448.6" font-size="16" fill="#1e1e1e">Schallwellen-Ausbreitung über</text>
<text x="28.0" y="468.6" font-size="16" fill="#1e1e1e">Luft</text>
<text x="348.0" y="448.6" font-size="16" fill="#1e1e1e">Massegesetz: Je massiver, desto</text>
<text x="348.0" y="468.6" font-size="16" fill="#1e1e1e">besser</text>
<text x="668.0" y="448.6" font-size="16" fill="#1e1e1e">Einzahlwert: Bewertetes</text>
<text x="668.0" y="468.6" font-size="16" fill="#1e1e1e">Schalldämm-Maß Rw</text>
<text x="348.0" y="318.6" font-size="16" fill="#1e1e1e">Luftschall</text>
<text x="988.0" y="458.6" font-size="16" fill="#1e1e1e">Ausbreitung in Festkörpern</text>
<text x="1308.0" y="448.6" font-size="16" fill="#1e1e1e">Entkopplung und</text>
<text x="1308.0" y="468.6" font-size="16" fill="#1e1e1e">Schwingungsreduktion</text>
<text x="1628.0" y="448.6" font-size="16" fill="#1e1e1e">Einzahlwert:</text>
<text x="1628.0" y="468.6" font-size="16" fill="#1e1e1e">Norm-Trittschallpegel Lnw</text>
<text x="1308.0" y="318.6" font-size="16" fill="#1e1e1e">Körperschall / Trittschall</text>
<text x="1948.0" y="458.6" font-size="16" fill="#1e1e1e">Bereich unter 100 Hz kritisch</text>
<text x="2268.0" y="448.6" font-size="16" fill="#1e1e1e">Spektrumanpassungswerte (z.B.</text>
<text x="2268.0" y="468.6" font-size="16" fill="#1e1e1e">CI,50-2500)</text>
<text x="2588.0" y="448.6" font-size="16" fill="#1e1e1e">Störpotenzial: Gehgeräusche</text>
<text x="2588.0" y="468.6" font-size="16" fill="#1e1e1e">(Dröhnen)</text>
<text x="2268.0" y="318.6" font-size="16" fill="#1e1e1e">Tiefe Frequenzen</text>
<text x="1308.0" y="178.6" font-size="16" fill="#1e1e1e">Grundlagen</text>
<text x="2908.0" y="308.6" font-size="16" fill="#1e1e1e">BASIS: Bauordnungsrechtliche</text>
<text x="2908.0" y="328.6" font-size="16" fill="#1e1e1e">Mindestwerte</text>
<text x="3228.0" y="308.6" font-size="16" fill="#1e1e1e">BASIS+: Mittlerer Standard,</text>
<text x="3228.0" y="328.6" font-size="16" fill="#1e1e1e">inkl. tiefe Frequenzen</text>
<text x="3548.0" y="308.6" font-size="16" fill="#1e1e1e">KOMFORT: Erhöhter Schallschutz,</text>
<text x="3548.0" y="328.6" font-size="16" fill="#1e1e1e">optimierte Bauteile</text>
<text x="3228.0" y="178.6" font-size="16" fill="#1e1e1e">Schallschutzniveaus</text>
<text x="3868.0" y="458.6" font-size="16" fill="#1e1e1e">Holztafelbauweise</text>
