<text x="-172.0" y="-58.0" font-size="20" fill="#1e1e1e">🏗️ Sparrenbemessung</text>
<text x="-172.0" y="-33.0" font-size="20" fill="#1e1e1e">nach EC5 (Eurocode 5)</text>
<text x="-172.0" y="17.0" font-size="20" fill="#1e1e1e">Grundnachweis:</text>
<text x="-172.0" y="42.0" font-size="20" fill="#1e1e1e">E_d ≤ R_d</text>
<text x="-172.0" y="67.0" font-size="20" fill="#1e1e1e">(Einwirkung ≤ Widerstand)</text>
<text x="-772.0" y="-368.9" font-size="19" fill="#1e1e1e">☁️ Lastannahmen (DIN EN 1991)</text>
<text x="-772.0" y="-345.1" font-size="19" fill="#1e1e1e">- Eigengewicht g_k ≈ 0,5–1,2 kN/m²</text>
<text x="-772.0" y="-321.4" font-size="19" fill="#1e1e1e">- Schneelast s_k (Zone +</text>
<text x="-772.0" y="-297.6" font-size="19" fill="#1e1e1e">Geländehöhe)</text>
<text x="-772.0" y="-273.9" font-size="19" fill="#1e1e1e">- Windlast w_k (Zone + Höhe)</text>
<text x="-772.0" y="-250.1" font-size="19" fill="#1e1e1e">- Sog Rand/Ecke: c_p bis −1,7</text>
<text x="-772.0" y="-226.4" font-size="19" fill="#1e1e1e">- Kombination: γ_G = 1,35 · γ_Q =</text>
<text x="-772.0" y="-202.6" font-size="19" fill="#1e1e1e">1,5</text>
<text x="428.0" y="184.6" font-size="23" fill="#1e1e1e">✅ Nachweise (GZT + GZG)</text>
<text x="428.0" y="213.3" font-size="23" fill="#1e1e1e">- Biegung: σ_m,d = M_d / W_y ≤</text>
<text x="428.0" y="242.1" font-size="23" fill="#1e1e1e">f_m,d</text>
<text x="428.0" y="270.8" font-size="23" fill="#1e1e1e">- Schub: τ_d = 1,5 · V_d / A ≤</text>
<text x="428.0" y="299.6" font-size="23" fill="#1e1e1e">f_v,d</text>
<text x="428.0" y="328.3" font-size="23" fill="#1e1e1e">- Durchbiegung:</text>
<text x="428.0" y="357.1" font-size="23" fill="#1e1e1e">- w_inst ≤ l/300</text>
<text x="428.0" y="385.8" font-size="23" fill="#1e1e1e">- w_fin ≤ l/200</text>
<text x="-792.0" y="185.4" font-size="24" fill="#1e1e1e">🔢 Bemessungsfestigkeit</text>
<text x="-792.0" y="215.4" font-size="24" fill="#1e1e1e">f_d = k_mod · f_k / γ_M</text>
<text x="-792.0" y="245.4" font-size="24" fill="#1e1e1e">- γ_M = 1,3 (Vollholz/BSH)</text>
<text x="-792.0" y="275.4" font-size="24" fill="#1e1e1e">- k_mod = 0,8 (KLED mittel,</text>
<text x="-792.0" y="305.4" font-size="24" fill="#1e1e1e">NKL 1/2)</text>
<text x="-792.0" y="335.4" font-size="24" fill="#1e1e1e">- f_k aus Festigkeitsklasse</text>
<text x="-792.0" y="365.4" font-size="24" fill="#1e1e1e">(z. B. C24)</text>
<text x="-182.0" y="546.3" font-size="28" fill="#1e1e1e">📄 HF1 Bautechnik</text>
<text x="428.0" y="-362.3" font-size="23" fill="#1e1e1e">📐 Schnittgrößen</text>
<text x="428.0" y="-333.6" font-size="23" fill="#1e1e1e">Einfeldträger:</text>
<text x="428.0" y="-304.8" font-size="23" fill="#1e1e1e">M_d = q_d · l² / 8</text>
<text x="428.0" y="-247.3" font-size="23" fill="#1e1e1e">Querkraft V_d (am Auflager)</text>
<text x="-300.0" y="-140.8" font-size="12" text-anchor="middle" fill="#1e1e1e" stroke="#ffffff" stroke-width="4" paint-order="stroke" font-weight="600">Eingangsgrößen</text>
<text x="300.0" y="-150.8" font-size="12" text-anchor="middle" fill="#1e1e1e" stroke="#ffffff" stroke-width="4" paint-order="stroke" font-weight="600">berechnen</text>
