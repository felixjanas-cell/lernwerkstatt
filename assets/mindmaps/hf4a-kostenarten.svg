<text x="-467.0" y="-229.3" font-size="21" fill="#1e1e1e">Abgrenzung der Begriffe</text>
<text x="213.0" y="-151.3" font-size="21" fill="#1e1e1e">Nach Art der Güter</text>
<text x="-467.0" y="-112.3" font-size="21" fill="#1e1e1e">Nach Zurechenbarkeit</text>
<text x="-467.0" y="121.7" font-size="21" fill="#1e1e1e">Nach Beschäftigung</text>
<text x="213.0" y="199.7" font-size="21" fill="#1e1e1e">Bezug Zimmerei / SVS</text>
<text x="-798.0" y="-230.2" font-size="17" fill="#1e1e1e">Auszahlung (Geldabfluss)</text>
<text x="-1132.0" y="-230.4" font-size="16" fill="#1e1e1e">Ausgabe (Beschaffungswert)</text>
<text x="-1472.0" y="-240.4" font-size="16" fill="#1e1e1e">Aufwand (period.</text>
<text x="-1472.0" y="-220.4" font-size="16" fill="#1e1e1e">Werteverzehr, GuV)</text>
<text x="-1812.0" y="-248.3" font-size="14" fill="#1e1e1e">Kosten = betriebl. Werteverzehr</text>
<text x="-1812.0" y="-230.8" font-size="14" fill="#1e1e1e">→ Grundkosten + Zusatzkosten</text>
<text x="-1812.0" y="-213.3" font-size="14" fill="#1e1e1e">(kalkulatorisch)</text>
<text x="562.0" y="-318.8" font-size="17" fill="#1e1e1e">Materialkosten (Holz,</text>
<text x="562.0" y="-297.6" font-size="17" fill="#1e1e1e">Dämmung…)</text>
<text x="562.0" y="-240.8" font-size="17" fill="#1e1e1e">Personalkosten (Lohn +</text>
<text x="562.0" y="-219.6" font-size="17" fill="#1e1e1e">Lohnnebenkosten)</text>
<text x="562.0" y="-162.8" font-size="17" fill="#1e1e1e">Kapital-/Abschreibungskost</text>
<text x="562.0" y="-141.6" font-size="17" fill="#1e1e1e">en (Maschinen)</text>
<text x="562.0" y="-84.8" font-size="17" fill="#1e1e1e">Fremdleistungskosten</text>
<text x="562.0" y="-63.5" font-size="17" fill="#1e1e1e">(Subunternehmer)</text>
<text x="562.0" y="3.8" font-size="17" fill="#1e1e1e">Wagnis · Steuern &amp; Abgaben</text>
<text x="-798.0" y="-172.4" font-size="16" fill="#1e1e1e">Einzelkosten – direkt</text>
<text x="-798.0" y="-152.4" font-size="16" fill="#1e1e1e">zurechenbar (Materialholz f.</text>
<text x="-798.0" y="-132.4" font-size="16" fill="#1e1e1e">Auftrag)</text>
<text x="-798.0" y="-94.4" font-size="16" fill="#1e1e1e">Gemeinkosten – nur indirekt</text>
<text x="-798.0" y="-74.4" font-size="16" fill="#1e1e1e">(Büro, Werkstatt,</text>
<text x="-798.0" y="-54.4" font-size="16" fill="#1e1e1e">Verwaltung) → Zuschlag</text>
<text x="-798.0" y="-16.4" font-size="16" fill="#1e1e1e">Fixkosten –</text>
<text x="-798.0" y="3.6" font-size="16" fill="#1e1e1e">beschäftigungsunabhängig</text>
<text x="-798.0" y="23.6" font-size="16" fill="#1e1e1e">(Miete, Versicherung)</text>
<text x="-798.0" y="61.6" font-size="16" fill="#1e1e1e">Variable Kosten – mit</text>
<text x="-798.0" y="81.6" font-size="16" fill="#1e1e1e">Leistung steigend (Material,</text>
<text x="-798.0" y="101.6" font-size="16" fill="#1e1e1e">Akkordlohn)</text>
<text x="-798.0" y="149.2" font-size="17" fill="#1e1e1e">Mischkosten (z.B. Strom:</text>
<text x="-798.0" y="170.4" font-size="17" fill="#1e1e1e">Grund + Verbrauch)</text>
<text x="562.0" y="61.6" font-size="16" fill="#1e1e1e">Lohn →</text>
<text x="562.0" y="81.6" font-size="16" fill="#1e1e1e">Stundenverrechnungssatz</text>
<text x="562.0" y="101.6" font-size="16" fill="#1e1e1e">(SVS)</text>
<text x="562.0" y="159.8" font-size="17" fill="#1e1e1e">Holz / Material</text>
<text x="562.0" y="227.2" font-size="17" fill="#1e1e1e">Maschinen &amp; Fuhrpark</text>
