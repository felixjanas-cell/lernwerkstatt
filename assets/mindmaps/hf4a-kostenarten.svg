<text x="768.0" y="43.6" font-size="16" fill="#1e1e1e">💶 Kostenarten (HF 4a)</text>
<text x="8.0" y="238.6" font-size="16" fill="#1e1e1e">Abgrenzung der Begriffe</text>
<text x="388.0" y="238.6" font-size="16" fill="#1e1e1e">Nach Art der Güter</text>
<text x="768.0" y="238.6" font-size="16" fill="#1e1e1e">Nach Zurechenbarkeit</text>
<text x="1148.0" y="238.6" font-size="16" fill="#1e1e1e">Nach Beschäftigung</text>
<text x="1528.0" y="238.6" font-size="16" fill="#1e1e1e">Bezug Zimmerei / SVS</text>
<text x="8.0" y="373.6" font-size="16" fill="#1e1e1e">Auszahlung (Geldabfluss)</text>
<text x="8.0" y="453.6" font-size="16" fill="#1e1e1e">Ausgabe (Beschaffungswert)</text>
<text x="8.0" y="523.6" font-size="16" fill="#1e1e1e">Aufwand (period. Werteverzehr,</text>
<text x="8.0" y="543.6" font-size="16" fill="#1e1e1e">GuV)</text>
<text x="8.0" y="603.6" font-size="16" fill="#1e1e1e">Kosten = betriebl. Werteverzehr →</text>
<text x="8.0" y="623.6" font-size="16" fill="#1e1e1e">Grundkosten + Zusatzkosten</text>
<text x="8.0" y="643.6" font-size="16" fill="#1e1e1e">(kalkulatorisch)</text>
<text x="388.0" y="373.6" font-size="16" fill="#1e1e1e">Materialkosten (Holz, Dämmung…)</text>
<text x="388.0" y="443.6" font-size="16" fill="#1e1e1e">Personalkosten (Lohn +</text>
<text x="388.0" y="463.6" font-size="16" fill="#1e1e1e">Lohnnebenkosten)</text>
<text x="388.0" y="523.6" font-size="16" fill="#1e1e1e">Kapital-/Abschreibungskosten</text>
<text x="388.0" y="543.6" font-size="16" fill="#1e1e1e">(Maschinen)</text>
<text x="388.0" y="603.6" font-size="16" fill="#1e1e1e">Fremdleistungskosten</text>
<text x="388.0" y="623.6" font-size="16" fill="#1e1e1e">(Subunternehmer)</text>
<text x="388.0" y="693.6" font-size="16" fill="#1e1e1e">Wagnis · Steuern &amp; Abgaben</text>
<text x="768.0" y="373.6" font-size="16" fill="#1e1e1e">Einzelkosten – direkt zurechenbar</text>
<text x="768.0" y="393.6" font-size="16" fill="#1e1e1e">(Materialholz f. Auftrag)</text>
<text x="768.0" y="473.6" font-size="16" fill="#1e1e1e">Gemeinkosten – nur indirekt (Büro,</text>
<text x="768.0" y="493.6" font-size="16" fill="#1e1e1e">Werkstatt, Verwaltung) → Zuschlag</text>
<text x="1148.0" y="363.6" font-size="16" fill="#1e1e1e">Fixkosten –</text>
<text x="1148.0" y="383.6" font-size="16" fill="#1e1e1e">beschäftigungsunabhängig (Miete,</text>
<text x="1148.0" y="403.6" font-size="16" fill="#1e1e1e">Versicherung)</text>
<text x="1148.0" y="473.6" font-size="16" fill="#1e1e1e">Variable Kosten – mit Leistung</text>
<text x="1148.0" y="493.6" font-size="16" fill="#1e1e1e">steigend (Material, Akkordlohn)</text>
<text x="1148.0" y="563.6" font-size="16" fill="#1e1e1e">Mischkosten (z.B. Strom: Grund +</text>
<text x="1148.0" y="583.6" font-size="16" fill="#1e1e1e">Verbrauch)</text>
<text x="1528.0" y="363.6" font-size="16" fill="#1e1e1e">Lohn → Stundenverrechnungssatz</text>
<text x="1528.0" y="383.6" font-size="16" fill="#1e1e1e">(SVS)</text>
<text x="1528.0" y="453.6" font-size="16" fill="#1e1e1e">Holz / Material</text>
<text x="1528.0" y="523.6" font-size="16" fill="#1e1e1e">Maschinen &amp; Fuhrpark</text>
<text x="1528.0" y="543.6" font-size="16" fill="#1e1e1e">(Abschreibung, Sprit)</text>
<text x="1528.0" y="613.6" font-size="16" fill="#1e1e1e">Verwaltung / Gemeinkosten → siehe</text>
<text x="1528.0" y="633.6" font-size="16" fill="#1e1e1e">[[BWL Allgemein (Mindmap).canvas]]</text>
<text x="1148.0" y="688.6" font-size="16" fill="#1e1e1e">❓ Active Recall: 3 eigene</text>
<text x="1148.0" y="708.6" font-size="16" fill="#1e1e1e">Kostenbeispiele aus deinem Betrieb</text>
<text x="1148.0" y="728.6" font-size="16" fill="#1e1e1e">je Kategorie eintragen</text>
